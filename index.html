<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050914">
<title>For You — Merry Christmas</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#02040a; }
  body { font-family: Georgia, "Times New Roman", serif; color:#e9f2ff; }
  #scene { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .vignette { position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse at 58% 48%, transparent 46%, rgba(0,0,0,.32) 100%); }
  .copy { position:fixed; left:clamp(28px,9vw,150px); top:50%; transform:translateY(-50%); z-index:2; pointer-events:none; animation:copy-in 1.25s cubic-bezier(.2,.8,.2,1) both; }
  h1 { position:relative; display:inline-block; margin:0; font-family:"Palatino Linotype","Book Antiqua",Georgia,serif; font-size:clamp(50px,7vw,96px); line-height:1.04; font-weight:400; font-style:italic; letter-spacing:-.045em; color:#83c8ff; text-shadow:0 0 26px rgba(74,163,255,.22); transform-origin:left center; pointer-events:auto; transition:transform .55s cubic-bezier(.2,.8,.2,1), color .45s ease, text-shadow .45s ease; }
  h1::after { content:""; position:absolute; left:2px; right:8%; bottom:-13px; height:1px; background:linear-gradient(90deg,rgba(116,198,255,.8),rgba(116,198,255,0)); transform:scaleX(0); transform-origin:left; transition:transform .55s cubic-bezier(.2,.8,.2,1); }
  h1:hover { transform:translateY(-5px) scale(1.035); color:#d9f2ff; text-shadow:0 0 18px rgba(90,183,255,.48),0 0 48px rgba(69,145,255,.24); }
  h1:hover::after { transform:scaleX(1); }
  h1 span { display:block; margin-top:14px; font-size:.48em; letter-spacing:.01em; color:#edf5ff; text-shadow:0 0 18px rgba(199,228,255,.16); white-space:nowrap; transition:color .45s ease,text-shadow .45s ease; }
  h1:hover span { color:#a8dcff; text-shadow:0 0 22px rgba(100,188,255,.44); }
  #hotpotButton { position:fixed; z-index:4; left:68%; top:94%; transform:translate(-50%,-50%); width:68px; height:68px; display:grid; place-items:center; border:1px solid rgba(255,225,239,.82); border-radius:50%; color:#fff6fb; background:radial-gradient(circle at 32% 24%,#ffb7d3,#c83c79 52%,#591d50 100%); box-shadow:0 0 18px rgba(255,105,169,.38),inset 0 1px 5px rgba(255,255,255,.55); cursor:pointer; transition:transform .25s ease,box-shadow .25s ease; animation:button-in 1s 1.4s both; }
  #hotpotButton:hover { transform:translate(-50%,-50%) scale(1.12); box-shadow:0 0 30px rgba(255,121,186,.75),inset 0 1px 5px rgba(255,255,255,.7); }
  #hotpotButton:active { transform:translate(-50%,-50%) scale(.93); }
  #hotpotButton svg { width:36px;height:36px; filter:drop-shadow(0 1px 2px rgba(42,5,24,.45)); }
  @keyframes button-in { from {opacity:0;scale:.6} to {opacity:1;scale:1} }
  @keyframes copy-in { from { opacity:0; filter:blur(7px); } to { opacity:1; filter:blur(0); } }
  @media (max-width:700px) {
    .copy { left:22px; top:6%; transform:none; }
    h1 { font-size:clamp(42px,12vw,68px); }
    #hotpotButton { width:60px;height:60px;top:94%; }
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="A glowing three-dimensional particle Christmas tree in falling snow"></canvas>
<div class="vignette"></div>
<main class="copy"><h1>for Qiuxia<span>Merry Christmas</span></h1></main>
<button id="hotpotButton" type="button" aria-label="Drop the hot pot" title="Drop the hot pot"><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M9 20h30l-3 17H12L9 20Z" fill="#fff2f7" stroke="#fff" stroke-width="2"/><path d="M7 19h34M15 16c-2-3 2-4 0-7m9 7c-2-3 2-4 0-7m9 7c-2-3 2-4 0-7" stroke="#fff" stroke-width="2.3" stroke-linecap="round"/><path d="M18 25h12" stroke="#e35b91" stroke-width="2.2" stroke-linecap="round"/><circle cx="17" cy="31" r="1.7" fill="#e35b91"/><circle cx="25" cy="31" r="1.7" fill="#e35b91"/><circle cx="32" cy="29" r="1.7" fill="#e35b91"/></svg></button>
<script>
(() => {
  const canvas = document.querySelector('#scene');
  const ctx = canvas.getContext('2d', { alpha:false });
  let w=0,h=0,dpr=1, raf;
  const rand = (a,b) => a + random()*(b-a);
  let seed=83201;
  const random=()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };

  const tree=[];
  // Layered cloud of needles: a tapered body with softly scalloped branch tiers.
  for(let i=0;i<9800;i++) {
    // Sample in proportion to canopy volume so the wide lower branches stay as full as the top.
    const t=1-Math.cbrt(1-random()), y=t*5.7;
    const tier= Math.floor(y/0.78), local=(y-tier*.78)/.78;
    const tierBase=.32 + (1-t)*1.53;
    const branchEdge=tierBase*(.84 + .16*Math.sin(local*Math.PI));
    const r=Math.sqrt(random())*branchEdge;
    const a=random()*Math.PI*2;
    tree.push({x:Math.cos(a)*r, y, z:Math.sin(a)*r, size:rand(.62,1.45), hue:random(), phase:rand(0,6.28),introAngle:rand(0,6.28),introSpread:rand(.5,3.0),introDelay:random()});
  }
  const trunk=[];
  for(let i=0;i<440;i++){
    const y=random()*.78, a=random()*Math.PI*2, r=Math.sqrt(random())*.19;
    trunk.push({x:Math.cos(a)*r,y,z:Math.sin(a)*r,size:rand(.8,1.65),hue:random(),phase:rand(0,6.28),introAngle:rand(0,6.28),introSpread:rand(.35,1.2),introDelay:random()});
  }
  // A luminous spiral garland winding all the way from the crown to the foot.
  const garland=[];
  for(let i=0;i<1750;i++) {
    const t=i/1749, y=.12+t*5.68, a=t*Math.PI*2*9.3;
    const r=.18+(1-t)*1.68;
    garland.push({x:Math.cos(a)*r,y,z:Math.sin(a)*r,size:rand(.8,2.0),phase:rand(0,6.28),hue:random(),introAngle:rand(0,6.28),introSpread:rand(.45,2.4),introDelay:random()});
  }
  const baubles=[];
  for(let i=0;i<52;i++) {
    const t=(i+.5)/52, y=.48+t*4.82, a=i*2.399963 + .35;
    const r=(.25+(1-y/5.7)*1.48)*rand(.83,1.02);
    baubles.push({x:Math.cos(a)*r,y,z:Math.sin(a)*r,h:i%2,phase:rand(0,6.28)});
  }
  const orbitSparkles=Array.from({length:64},()=>({y:rand(.38,5.38),angle:rand(0,6.28),radius:rand(.72,1.08),size:rand(1.0,2.5),phase:rand(0,6.28),color:random()<.5?'#ff9ac4':'#fff3f9'}));
  function makeSnowGrid(columns,rows,minSize,maxSize,minSpeed,maxSpeed,minAlpha,maxAlpha){
    const flakes=[];
    for(let row=0;row<rows;row++)for(let col=0;col<columns;col++){
      const stagger=(row%2)*.5, jitter=(random()-.5)*.22;
      const baseX=(col+stagger+.5+jitter)/columns;
      flakes.push({baseX,y:(row+.5+(random()-.5)*.24)/rows,r:rand(minSize,maxSize),v:rand(minSpeed,maxSpeed),phase:rand(0,6.28),alpha:rand(minAlpha,maxAlpha),sway:rand(.004,.016),spin:rand(-.00045,.00045),color:random()<.52?'#f5f9ff':'#b9e4ff'});
    }
    return flakes;
  }
  const snow=makeSnowGrid(10,12,1.05,2.25,.0007,.00145,.42,.84);
  const frontSnow=makeSnowGrid(5,8,3.0,5.4,.00125,.0025,.45,.86);
  let rotation=-.35, targetRotation=-.35, tilt=0, targetTilt=0;
  let dragging=false, lastX=0, lastY=0, lastFrameTime=0;
  let hotpotDrop=null, sceneCx=0;
  const hotpotButton=document.querySelector('#hotpotButton');

  const potParticles=[];
  const potDot=(x,y,color,r=.009,steam=false)=>potParticles.push({x,y,color,r,steam,phase:rand(0,6.28)});
  function potLine(x1,y1,x2,y2,count,color,r=.008){
    for(let i=0;i<=count;i++){const t=i/count;potDot(x1+(x2-x1)*t,y1+(y2-y1)*t,color,r*rand(.75,1.25));}
  }
  function potCurve(a,b,c,d,count,color,r=.008,steam=false){
    for(let i=0;i<=count;i++){const t=i/count,u=1-t;
      const x=u*u*u*a[0]+3*u*u*t*b[0]+3*u*t*t*c[0]+t*t*t*d[0];
      const y=u*u*u*a[1]+3*u*u*t*b[1]+3*u*t*t*c[1]+t*t*t*d[1];
      potDot(x,y,color,r*rand(.75,1.25),steam);
    }
  }
  function potEllipse(cx,cy,rx,ry,count,color,r=.008,start=0,end=Math.PI*2){
    for(let i=0;i<count;i++){const a=start+(end-start)*i/(count-1);potDot(cx+Math.cos(a)*rx,cy+Math.sin(a)*ry,color,r*rand(.75,1.25));}
  }
  function makeHotpot(){
    // Two shimmering broths in the oval opening.
    for(let i=0;i<230;i++){
      const a=random()*Math.PI*2, rr=Math.sqrt(random()), x=Math.cos(a)*.82*rr, y=.14+Math.sin(a)*.145*rr;
      const red=['#ff765d','#ffb05e','#ffd589'][i%3], blue=['#8be0e8','#b7eff1','#f2d995'][i%3];
      potDot(x,y,x<.055?red:blue,rand(.006,.013));
    }
    potEllipse(0,.15,.96,.205,180,'#f6d28d',.009);
    potEllipse(0,.15,.87,.158,150,'#fff0c4',.006);
    potCurve([-.91,.19],[-.83,.52],[-.72,.78],[-.55,.83],100,'#d79b61',.011);
    potCurve([.91,.19],[.83,.52],[.72,.78],[.55,.83],100,'#d79b61',.011);
    potEllipse(0,.83,.56,.115,110,'#f1c77d',.009);
    potEllipse(0,.94,.34,.075,72,'#fff0c4',.009);
    // A cool blue divider makes the split hotpot legible.
    potCurve([.04,.01],[-.19,.15],[.2,.29],[-.04,.43],68,'#e7fbff',.009);
    potCurve([-.04,.43],[-.28,.58],[.2,.7],[.02,.82],68,'#c4efff',.009);
    // Handles and a few evenly-spaced ingredients.
    potEllipse(-.98,.2,.22,.095,54,'#d8eefe',.009,.6,Math.PI*1.4);
    potEllipse(.98,.2,.22,.095,54,'#d8eefe',.009,-.4,Math.PI*.4);
    for(const [x,y,c] of [[-.57,.12,'#f5e5c4'],[-.28,.21,'#ffdf9a'],[.36,.1,'#f2e9d5'],[.62,.18,'#a5e7c7'],[-.68,.2,'#a5e7c7'],[.2,.21,'#ff9470']]){
      potEllipse(x,y,.075,.035,22,c,.012);
    }
    potCurve([-.56,.08],[-.62,-.1],[-.4,-.13],[-.48,-.28],25,'#dff8ff',.008,true);
    potCurve([-.08,.02],[-.2,-.13],[.12,-.16],[.03,-.34],28,'#f7fbff',.008,true);
    potCurve([.42,.06],[.32,-.08],[.57,-.16],[.48,-.3],25,'#b9e9ff',.008,true);
    return potParticles;
  }
  makeHotpot();
  function spawnHotpot(clientX){
    const compact=w<700,size=Math.min(w*(compact?.20:.21),h*(compact?.22:.24));
    const margin=size*1.24,x=Math.max(margin,Math.min(w-margin,clientX));
    hotpotDrop={x,y:-size*1.35,startY:-size*1.35,startedAt:null,duration:360,size,landed:false,landedAt:0,sparks:[],targetY:h*.89-size*.96};
  }
  hotpotButton.addEventListener('click',()=>spawnHotpot(sceneCx||w*.57));

  function resize(){
    dpr=Math.min(devicePixelRatio||1,2); w=innerWidth; h=innerHeight;
    canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener('resize',resize); resize();
  canvas.addEventListener('pointerdown',e=>{
    dragging=true; lastX=e.clientX; lastY=e.clientY;
    canvas.setPointerCapture(e.pointerId); canvas.style.cursor='grabbing';
  });
  canvas.addEventListener('pointermove',e=>{
    if(!dragging)return;
    targetRotation+=(e.clientX-lastX)*.017;
    targetTilt+=(e.clientY-lastY)*.0095;
    targetTilt=Math.max(-.62,Math.min(.62,targetTilt));
    lastX=e.clientX; lastY=e.clientY;
  });
  const stopDrag=()=>{dragging=false;canvas.style.cursor='grab';};
  canvas.addEventListener('pointerup',stopDrag);
  canvas.addEventListener('pointercancel',stopDrag);
  canvas.style.cursor='grab';

  function project(p,time,scale,centerX,centerY,rot,tilt) {
    const sway=Math.sin(time*.00038)*.06;
    const x=p.x*Math.cos(rot)+p.z*Math.sin(rot), z=-p.x*Math.sin(rot)+p.z*Math.cos(rot);
    const yy=p.y*Math.cos(tilt)-z*Math.sin(tilt);
    const zz=p.y*Math.sin(tilt)+z*Math.cos(tilt);
    const xx=x*Math.cos(sway)-yy*.035*Math.sin(sway);
    const camera=8.6, perspective=camera/(camera+zz*.68);
    return {x:centerX+xx*scale*perspective,y:centerY-(yy-2.85)*scale*perspective,z, perspective};
  }
  function entrancePosition(p,time){
    const delay=p.introDelay*620+p.y*88,u=Math.max(0,Math.min(1,(time-delay)/3900));
    const eased=u*u*(3-2*u),remain=1-eased,angle=p.introAngle+remain*15.5;
    return {x:p.x+Math.cos(angle)*p.introSpread*remain*2.7,y:p.y+remain*(1.65+Math.sin(p.phase+time*.0018)*.34),z:p.z+Math.sin(angle)*p.introSpread*remain*2.7,alpha:.018+.982*eased};
  }
  function glowDot(x,y,r,color,alpha=1,blur=8){
    ctx.globalAlpha=alpha; ctx.shadowColor=color; ctx.shadowBlur=blur; ctx.fillStyle=color;
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  }
  function drawForegroundSnow(time){
    for(const f of frontSnow){
      f.y+=f.v*(h/900);
      if(f.y>1.04)f.y=-.04;
      const sway=Math.sin(time*.00042+f.phase)*f.sway+Math.sin(time*.00011)*.012;
      const x=((f.baseX+sway+1)%1)*w,y=f.y*h,r=f.r*(.82+f.y*.35),a=f.alpha*(.78+.22*Math.sin(time*.001+f.phase));
      glowDot(x,y,r*.55,f.color,a,11);
      ctx.save();ctx.translate(x,y);ctx.rotate(time*f.spin+f.phase);ctx.globalAlpha=a*.84;ctx.strokeStyle=f.color;ctx.lineWidth=.95;
      for(let k=0;k<6;k++){ctx.rotate(Math.PI/3);ctx.beginPath();ctx.moveTo(0,-r*.12);ctx.lineTo(0,-r*1.5);ctx.moveTo(0,-r*.82);ctx.lineTo(-r*.32,-r*1.1);ctx.moveTo(0,-r*.82);ctx.lineTo(r*.32,-r*1.1);ctx.stroke();}
      if(f.v>.002){ctx.globalAlpha=a*.24;ctx.beginPath();ctx.moveTo(0,r*.45);ctx.lineTo(0,r*2.1);ctx.stroke();}
      ctx.restore();
    }
  }
  function drawBackdrop(){
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.fillStyle='#02040a';ctx.fillRect(0,0,w,h);
  }
  function drawEntranceEffects(time,cx,cy,scale){
    const fade=Math.max(0,1-time/5400);
    if(fade<=0)return;
    const burst=Math.exp(-Math.pow((time-240)/680,2));
    ctx.save();ctx.globalCompositeOperation='lighter';
    const flash=ctx.createRadialGradient(cx,cy-scale*.35,0,cx,cy-scale*.35,scale*4.2);
    flash.addColorStop(0,`rgba(255,223,239,${.58*burst})`);flash.addColorStop(.24,`rgba(255,112,177,${.34*burst})`);flash.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=flash;ctx.fillRect(cx-scale*4.5,cy-scale*4.7,scale*9,scale*9);
    // Champagne-gold rays flare out as the particles gather.
    ctx.translate(cx,cy-scale*.28);ctx.rotate(time*.00016);ctx.lineCap='round';
    for(let i=0;i<40;i++){
      const a=i*Math.PI*2/40, inner=scale*(.22+(.5+.5*Math.sin(i*4.7))* .28), outer=scale*(2.4+(.5+.5*Math.sin(i*2.3))*2.0);
      ctx.globalAlpha=burst*(i%4===0?.55:.3);ctx.strokeStyle=i%4===0?'#fff7fc':'#ff9dc8';ctx.shadowColor='#ff65a8';ctx.shadowBlur=28;ctx.lineWidth=i%4===0?2:1.1;
      ctx.beginPath();ctx.moveTo(Math.cos(a)*inner,Math.sin(a)*inner);ctx.lineTo(Math.cos(a)*outer,Math.sin(a)*outer);ctx.stroke();
    }
    ctx.restore();
    // Expanding ground rings mark the tree's arrival.
    const groundY=cy+scale*2.93;
    for(let ring=0;ring<4;ring++){
      const age=Math.max(0,time-ring*340), progress=Math.min(1,age/2100);
      if(progress>=1)continue;
      ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=(1-progress)*(.68-ring*.09);ctx.strokeStyle=ring%2===0?'#fff2f8':'#ff82b8';ctx.shadowColor='#ff6eae';ctx.shadowBlur=30;ctx.lineWidth=3.2-progress*2.1;
      ctx.beginPath();ctx.ellipse(cx,groundY,scale*(.3+progress*2.55),scale*(.045+progress*.12),0,0,Math.PI*2);ctx.stroke();ctx.restore();
    }
    // A glowing sweep travels up the trunk while the tree forms from the base.
    const rise=Math.min(1,time/4900), sweepY=groundY-rise*scale*5.75, sweepR=scale*(.22+(1-rise)*1.7);
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=(1-rise*.72)*fade;ctx.strokeStyle='#fff3fa';ctx.shadowColor='#ff72ae';ctx.shadowBlur=34;ctx.lineWidth=3;
    ctx.beginPath();ctx.ellipse(cx,sweepY,sweepR,sweepR*.12,0,0,Math.PI*2);ctx.stroke();ctx.restore();
    // A wider, brighter spiral of sparks flies outward during the reveal.
    for(let i=0;i<148;i++){
      const age=time-i*15;if(age<0||age>2600)continue;
      const p=age/2600, angle=i*2.399963+age*.0025, distance=scale*(.35+p*4.2), alpha=(1-p)*fade*.95;
      glowDot(cx+Math.cos(angle)*distance,cy-scale*.25+Math.sin(angle)*distance*.78,1.5+(i%4)*.48,i%5===0?'#fff9fd':'#ff91bd',alpha,17);
    }
  }
  function drawOrbitTrails(time,cx,cy,scale){
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
    for(let i=0;i<3;i++){
      const yLevel=1.15+i*1.28, radius=scale*(.58+(1-yLevel/5.8)*1.65), centerY=cy+(2.85-yLevel)*scale;
      ctx.save();ctx.translate(cx,centerY);ctx.rotate(time*.00023*(i%2?1:-1)+i*.8);ctx.scale(1,.2);
      ctx.globalAlpha=.27+.12*Math.sin(time*.002+i);ctx.strokeStyle=i===1?'#fff4fb':'#ff8fbe';ctx.shadowColor='#ff74ae';ctx.shadowBlur=18;ctx.lineWidth=1.45;
      ctx.beginPath();ctx.ellipse(0,0,radius,radius*.94,0,.18,Math.PI*1.52);ctx.stroke();ctx.restore();
    }
    ctx.restore();
  }
  function drawHotpot(time){
    if(!hotpotDrop)return;
    const d=hotpotDrop;
    if(!d.landed){
      if(d.startedAt===null)d.startedAt=time;
      const flight=Math.min(1,(time-d.startedAt)/d.duration),ease=flight*flight;
      d.y=d.startY+(d.targetY-d.startY)*ease;
      if(flight>=1){d.y=d.targetY;d.landed=true;d.landedAt=time;
        d.sparks=Array.from({length:90},()=>{const a=random()*Math.PI*2,v=rand(1.2,5.2);return{x:d.x,y:d.y+d.size*.96,vx:Math.cos(a)*v,vy:-Math.abs(Math.sin(a)*v)-rand(.2,2),r:rand(1,3.2),color:random()<.5?'#b9e4ff':'#ffd589',life:1};});
      }
    }
    const age=d.landed?time-d.landedAt:0, bounce=d.landed?Math.sin(Math.min(1,age/520)*Math.PI)*Math.exp(-age/420)*d.size*.08:0;
    if(d.landed){
      ctx.save();ctx.globalAlpha=.19;ctx.fillStyle='#86d9ff';ctx.shadowColor='#63c9ff';ctx.shadowBlur=26;
      ctx.beginPath();ctx.ellipse(d.x,d.y+d.size*.97,d.size*(.45+Math.min(age/1200,1)*.9),d.size*.075,0,0,Math.PI*2);ctx.fill();ctx.restore();
      if(age<1300){const t=age/1300;ctx.save();ctx.globalAlpha=(1-t)*.42;ctx.strokeStyle='#a9e8ff';ctx.shadowColor='#6dd4ff';ctx.shadowBlur=16;ctx.lineWidth=1.6*(1-t);
        ctx.beginPath();ctx.ellipse(d.x,d.y+d.size*.97,d.size*(.55+t*.85),d.size*(.05+t*.09),0,0,Math.PI*2);ctx.stroke();ctx.restore();}
      for(const s of d.sparks){s.x+=s.vx;s.y+=s.vy;s.vy+=.12;s.life*=.965;if(s.life>.035)glowDot(s.x,s.y,s.r*s.life,s.color,s.life,8);}
    }
    for(const p of potParticles){
      const steamOffset=p.steam?Math.sin(time*.004+p.phase)*3.6:0;
      const x=d.x+p.x*d.size+Math.sin(time*.002+p.phase)*.45;
      const y=d.y+p.y*d.size-bounce+steamOffset;
      glowDot(x,y,Math.max(.7,p.r*d.size),p.color,.72+.28*Math.sin(time*.002+p.phase),p.steam?8:5);
    }
    if(d.landed&&age<4800){
      const raw=Math.max(0,Math.min(1,(age-100)/440)), back=raw-1;
      const pop=1+2.3*back*back*back+1.3*back*back;
      const fade=age>4000?(4800-age)/800:1, alpha=raw*fade;
      const caption="Qiuxia's hot pot is so delicious!", fontSize=Math.max(14,Math.min(23,d.size*.16));
      ctx.save();ctx.font=`italic 700 ${fontSize}px Georgia, 'Times New Roman', serif`;
      const textWidth=ctx.measureText(caption).width, boxWidth=textWidth+30, boxHeight=fontSize*1.9;
      const tx=Math.max(boxWidth*.5+10,Math.min(w-boxWidth*.5-10,d.x)), ty=d.y-d.size*.68;
      ctx.translate(tx,ty);ctx.scale(pop,pop);ctx.globalAlpha=alpha;
      ctx.beginPath();ctx.roundRect(-boxWidth*.5,-boxHeight*.5,boxWidth,boxHeight,boxHeight*.42);
      ctx.fillStyle='rgba(4,5,12,.96)';ctx.fill();ctx.strokeStyle='rgba(255,224,237,.96)';ctx.lineWidth=1.5;ctx.stroke();
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fffafd';ctx.shadowBlur=0;
      ctx.fillText(caption,0,0);ctx.restore();
    }
  }
  function frame(now){
    raf=requestAnimationFrame(frame);
    const time=now||0;
    const frameFactor=lastFrameTime?Math.min(2.5,(time-lastFrameTime)/16.667):1;lastFrameTime=time;
    if(!dragging)targetRotation+=.0013*frameFactor;
    rotation+=(targetRotation-rotation)*.045;
    tilt+=(targetTilt-tilt)*.07;
    drawBackdrop();
    // Snow comes forward as softly focused flakes at several depths.
    for(const f of snow){
      f.y+=f.v*(h/900);
      if(f.y>1.02)f.y=-.02;
      const sway=Math.sin(time*.00037+f.phase)*f.sway+Math.sin(time*.0001)*.01;
      const x=((f.baseX+sway+1)%1)*w,y=f.y*h,r=f.r*(.8+f.y*.55),alpha=f.alpha*(.75+.25*Math.sin(time*.001+f.phase));
      glowDot(x,y,r,f.color,alpha, r>1.8?8:3);
      ctx.save();ctx.translate(x,y);ctx.rotate(time*f.spin+f.phase);ctx.globalAlpha=alpha*.76;ctx.strokeStyle=f.color;ctx.lineWidth=.78;ctx.beginPath();
      for(let k=0;k<6;k++){ctx.rotate(Math.PI/3);ctx.moveTo(0,0);ctx.lineTo(0,-r*1.8);ctx.moveTo(0,-r*1.05);ctx.lineTo(-r*.28,-r*1.3);ctx.moveTo(0,-r*1.05);ctx.lineTo(r*.28,-r*1.3);}
      ctx.stroke();ctx.restore();
    }
    const compact=w<700, scale=Math.min(h*(compact?.12:.135),w*(compact?.235:.44));
    const cx=compact?w*.55:w*.68, cy=h*(compact?.49:.48);
    sceneCx=cx;
    hotpotButton.style.left=`${cx}px`;
    hotpotButton.style.top=`${Math.min(h-35,cy+scale*3.36)}px`;
    // Ground halo and a subtle reflection beneath the tree.
    ctx.save();ctx.translate(cx,cy+scale*2.95);ctx.scale(1,.22);
    const halo=ctx.createRadialGradient(0,0,scale*.1,0,0,scale*2.2);halo.addColorStop(0,'rgba(255,151,198,.3)');halo.addColorStop(.45,'rgba(151,61,112,.14)');halo.addColorStop(1,'rgba(18,46,100,0)');
    ctx.fillStyle=halo;ctx.beginPath();ctx.arc(0,0,scale*2.2,0,Math.PI*2);ctx.fill();ctx.restore();
    // Draw back-to-front for a convincing volumetric point cloud.
    const sceneReveal=Math.min(1,time/4900);
    drawEntranceEffects(time,cx,cy,scale);
    drawOrbitTrails(time,cx,cy,scale);
    const points=[];
    for(const p of tree){const start=entrancePosition(p,time),q=project(start,time,scale,cx,cy,rotation,tilt);points.push({...q,type:0,p,entranceAlpha:start.alpha});}
    for(const p of garland){const start=entrancePosition(p,time),q=project(start,time,scale,cx,cy,rotation,tilt);points.push({...q,type:1,p,entranceAlpha:start.alpha});}
    for(const p of trunk){const start=entrancePosition(p,time),q=project(start,time,scale,cx,cy,rotation,tilt);points.push({...q,type:2,p,entranceAlpha:start.alpha});}
    points.sort((a,b)=>a.z-b.z);
    for(const q of points){
      const flicker=.55+.45*Math.sin(time*.002+q.p.phase), size=q.p.size*q.perspective*(q.type?1.08:1);
      if(q.type===1){glowDot(q.x,q.y,size,q.p.hue>.5?'#fff9fc':'#ffe3f0',flicker*.98*q.entranceAlpha,14);}
      else if(q.type===2){glowDot(q.x,q.y,size,q.p.hue>.5?'#9b574d':'#d18468',(.82+flicker*.16)*q.entranceAlpha,4);}
      else {const hue=324+q.p.hue*28, light=52+q.p.hue*20;glowDot(q.x,q.y,size,`hsl(${hue} 91% ${light}%)`,(.78+flicker*.22)*q.entranceAlpha,7);}
    }
    for(const b of baubles){const q=project(b,time,scale,cx,cy,rotation,tilt), c=b.h?'#ffd66f':'#fff0f7';
      glowDot(q.x,q.y,4.5*q.perspective,c,.98*sceneReveal,19);glowDot(q.x-1,q.y-1,1.3,'#fffaf0',.95*sceneReveal,4);
    }
    for(const s of orbitSparkles){
      const a=s.angle+time*.00022*(s.y%2?1:-1), t=s.y/5.7, r=s.radius*(.34+(1-t)*1.5);
      const q=project({x:Math.cos(a)*r,y:s.y,z:Math.sin(a)*r},time,scale,cx,cy,rotation,tilt);
      const twinkle=.3+.7*(.5+.5*Math.sin(time*.003+s.phase));
      glowDot(q.x,q.y,s.size*q.perspective,s.color,twinkle*sceneReveal,10);
    }
    // Star topper with long, fine rays.
    const top=project({x:0,y:5.95,z:0},time,scale,cx,cy,rotation,tilt), pulse=.78+.22*Math.sin(time*.003);
    ctx.save();ctx.translate(top.x,top.y);ctx.rotate(time*.00022);
    ctx.globalAlpha=.96*sceneReveal;ctx.strokeStyle='#fff7fc';ctx.lineWidth=1.7;ctx.shadowColor='#ff8fbe';ctx.shadowBlur=34;
    for(let i=0;i<8;i++){ctx.rotate(Math.PI/4);ctx.beginPath();ctx.moveTo(0,-2);ctx.lineTo(0,-14*pulse);ctx.stroke();}
    ctx.fillStyle='#fff7fc';ctx.beginPath();ctx.arc(0,0,5.7*pulse,0,Math.PI*2);ctx.fill();ctx.restore();
    ctx.globalAlpha=1;
    drawHotpot(time);
    drawForegroundSnow(time);
  }
  frame(0);
})();
</script>
